# The gate (scripts/gate.sh) on every pull request, its three parts at once,
# as `/claude gate` runs them: checks (formatting, licences, lints, clippy,
# the wasm32 build, the plugins' and web UI's tests), tests (the build and
# the workspace's tests) and perf (the budgets, held to a runner's limits as
# ADR 0126 says, and the end-to-end tests). The desktop app and the speech
# helper are checked locally, as they are by `/claude gate`.
#
# A fork's pull request runs here without approval: `pull_request` gives it
# a read-only token and no secrets, and whatever it caches stays on its own
# ref. So nothing here may need a secret or a write permission.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Smaller builds, to fit the runner's disk, as scripts/cloud-setup.sh does.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  SILT_SKIP_VOICE: "1"

jobs:
  gate:
    name: Gate (${{ matrix.part }})
    strategy:
      fail-fast: false
      matrix:
        part: [checks, tests, perf]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # GitHub's merge commit has the base, then the head, as parents.
      # `/claude merge` reads this to skip a gate this run already passed.
      - name: What's gated
        if: github.event_name == 'pull_request'
        run: |
          set -- $(git cat-file -p HEAD | sed -n 's/^parent //p')
          echo "::notice title=gated::head $2, base $1"
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: The sandbox's tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap passt
          # Ubuntu 24.04 keeps unprivileged user namespaces, which bubblewrap needs, from programs without an AppArmor profile.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Builds on the larger disk
        run: |
          if [ -d /mnt ] && [ ! -e target ]; then
            sudo mkdir -p /mnt/target && sudo chown "$USER" /mnt/target && ln -s /mnt/target target
          fi
      - name: Rust
        run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ci-${{ matrix.part }}
          workspaces: |
            .
            plugins -> ../target/plugins
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest,cargo-deny
      - name: Playwright's browser
        if: matrix.part == 'perf'
        run: |
          pnpm -C web install --frozen-lockfile
          pnpm -C web exec playwright install --with-deps chromium
      - name: Gate
        run: scripts/gate.sh --part "${{ matrix.part }}"
