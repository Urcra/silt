# The checks every pull request gets: formatting, lints, licences, the
# wasm32 build of the pure crates, the web UI's tests and the workspace's
# tests. The rest of scripts/gate.sh (the desktop app, the speech helper,
# the performance budgets and the end-to-end tests) runs before a merge.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Smaller builds, to fit the runner's disk, as scripts/cloud-setup.sh does.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust
        run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            .
            plugins -> ../target/plugins
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deny
      - name: Web dependencies
        run: pnpm -C web install --frozen-lockfile
      - name: Formatting
        run: |
          cargo fmt --all -- --check
          (cd plugins && cargo fmt --all -- --check)
          pnpm -C web fmt:check
      - name: Licences
        run: |
          cargo deny --log-level error check licenses
          (cd plugins && cargo deny --log-level error --config ../deny.toml check licenses)
      - name: Web lint
        run: pnpm -C web lint
      - name: Web build
        run: VITE_SILT_MOCKS=on pnpm -C web build
      - name: Clippy
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          (cd plugins && cargo clippy --workspace --target wasm32-wasip2 --target-dir ../target/plugins -- -D warnings)
      - name: wasm32 build of the pure crates
        run: cargo build -p silt-types -p silt-sumtree -p silt-crdt -p silt-log -p silt-checkout -p silt-wasm -p silt-workspace -p silt-design -p silt-theme -p silt-sheet -p silt-access -p silt-plugin -p silt-forge --target wasm32-unknown-unknown

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: The sandbox's tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap passt
          # Ubuntu 24.04 keeps unprivileged user namespaces, which bubblewrap needs, from programs without an AppArmor profile.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust
        run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            .
            plugins -> ../target/plugins
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest
      - name: Web dependencies and build
        run: |
          pnpm -C web install --frozen-lockfile
          VITE_SILT_MOCKS=on pnpm -C web build
      - name: Web unit tests
        run: pnpm -C web exec vitest run
      - name: Plugins' tests
        run: cd plugins && cargo test --workspace --target-dir ../target/plugins --quiet
      - name: Build
        run: cargo build --workspace
      - name: Tests
        run: |
          cargo nextest run --workspace --test-threads "$(($(nproc) * 2))"
          cargo test --workspace --doc
