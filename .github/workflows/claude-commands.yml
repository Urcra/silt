# Starts a Claude Code cloud session from a PR comment, through the API
# trigger of a scheduled task on claude.ai:
#   /claude gate [notes]          resolve conflicts, run the gate, push fixes
#   /claude review [fix] [notes]  review the PR, and with `fix` fix the findings
#   /claude watch [merge] [notes] stay on the PR: fix conflicts, review comments
#                                 and gate failures as they come, until merged;
#                                 with `merge`, merge it once it's ready
#   /claude unwatch               fires nothing: the watching session reads it
# The watch task's prompt is in .github/claude-tasks/watch.md.
# Only people with write access can start one, and only from a comment that
# starts with the command, so the sessions' own comments never fire it.
name: Claude commands

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: write

jobs:
  fire:
    if: >-
      (github.event.issue.pull_request || github.event.pull_request) &&
      startsWith(github.event.comment.body, '/claude ') &&
      github.event.comment.user.type != 'Bot' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start the session
        env:
          BODY: ${{ github.event.comment.body }}
          PR: ${{ github.event.issue.number || github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          REQUESTER: ${{ github.event.comment.user.login }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
          COMMENT_ID: ${{ github.event.comment.id }}
          EVENT: ${{ github.event_name }}
          GATE_URL: ${{ secrets.CLAUDE_GATE_FIRE_URL }}
          GATE_TOKEN: ${{ secrets.CLAUDE_GATE_FIRE_TOKEN }}
          REVIEW_URL: ${{ secrets.CLAUDE_REVIEW_FIRE_URL }}
          REVIEW_TOKEN: ${{ secrets.CLAUDE_REVIEW_FIRE_TOKEN }}
          WATCH_URL: ${{ secrets.CLAUDE_WATCH_FIRE_URL }}
          WATCH_TOKEN: ${{ secrets.CLAUDE_WATCH_FIRE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          react() {
            if [ "$EVENT" = pull_request_review_comment ]; then
              path="repos/$REPO/pulls/comments/$COMMENT_ID/reactions"
            else
              path="repos/$REPO/issues/comments/$COMMENT_ID/reactions"
            fi
            gh api "$path" -f content="$1" >/dev/null
          }

          first=$(printf '%s\n' "$BODY" | head -n1 | tr -d '\r')
          read -r _ command rest <<<"$first"
          mode=
          case "$command" in
            gate) url=$GATE_URL token=$GATE_TOKEN ;;
            review)
              url=$REVIEW_URL token=$REVIEW_TOKEN mode=report
              read -r word after <<<"$rest" || true
              if [ "${word:-}" = fix ]; then mode=fix rest=${after:-}; fi
              ;;
            watch)
              url=$WATCH_URL token=$WATCH_TOKEN
              read -r word after <<<"$rest" || true
              if [ "${word:-}" = merge ]; then mode=merge rest=${after:-}; fi
              ;;
            unwatch) react +1; exit 0 ;;
            *) react confused; echo "unknown command: $command" >&2; exit 0 ;;
          esac
          notes=$(printf '%s\n%s' "$rest" "$(printf '%s\n' "$BODY" | tail -n +2)")

          text=$(printf 'command: %s\nmode: %s\nrepository: %s\npull_request: %s\nrequested_by: %s\ncomment: %s\nnotes from the requester:\n%s\n' \
            "$command" "${mode:-none}" "$REPO" "$PR" "$REQUESTER" "$COMMENT_URL" "$notes")

          if jq -n --arg text "$text" '{text: $text}' | curl -sSf -X POST "$url" \
              -H "Authorization: Bearer $token" \
              -H 'anthropic-beta: experimental-cc-routine-2026-04-01' \
              -H 'anthropic-version: 2023-06-01' \
              -H 'Content-Type: application/json' \
              --data-binary @- >/dev/null; then
            react eyes
          else
            react confused
            exit 1
          fi
