# `/claude fix` and `/claude merge` on a pull request, run here with
# claude-code-action, so what Claude writes on the PR comes from claude[bot]:
#   /claude fix [notes]    merge the base in if it conflicts, make the changes
#                          review threads and comments ask for, reply and
#                          resolve them, and push; never merges
#   /claude merge [notes]  run the full gate on the head merged with its base,
#                          fix conflicts and failures (up to two rounds), wait
#                          for CI, then merge with a merge commit
# Only people with write access can start one. Claude never decides to merge:
# .github/scripts/claude-pr.sh, taken from the default branch so a PR can't
# change it, merges only a head that passed the gate and CI with no review
# left open. Needs the Claude GitHub App on the repository and the
# CLAUDE_CODE_OAUTH_TOKEN secret (`claude setup-token`).
name: Claude fix and merge

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  id-token: write

concurrency:
  group: claude-pr-${{ github.event.issue.number }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Smaller builds, to fit the runner's disk, as scripts/cloud-setup.sh does.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  run:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.user.type != 'Bot' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
      (startsWith(github.event.comment.body, '/claude fix') || startsWith(github.event.comment.body, '/claude merge'))
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.issue.number }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      HELPER: ${{ runner.temp }}/claude-pr.sh
    steps:
      - name: The command
        id: command
        env:
          BODY: ${{ github.event.comment.body }}
          COMMENT_ID: ${{ github.event.comment.id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          first=$(printf '%s\n' "$BODY" | head -n1 | tr -d '\r')
          read -r _ command rest <<<"$first" || true
          case "$command" in
            fix | merge) ;;
            *) echo "mode=" >>"$GITHUB_OUTPUT"; exit 0 ;;
          esac
          echo "mode=$command" >>"$GITHUB_OUTPUT"
          printf '%s\n%s\n' "$rest" "$(printf '%s\n' "$BODY" | tail -n +2)" >"$RUNNER_TEMP/notes.txt"
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID/reactions" -f content=eyes >/dev/null
          # The checks that guard a merge come from the default branch, not the PR.
          gh api "repos/$GITHUB_REPOSITORY/contents/.github/scripts/claude-pr.sh?ref=$DEFAULT_BRANCH" \
            -H 'Accept: application/vnd.github.raw' >"$HELPER"
          chmod +x "$HELPER"

      - name: The pull request
        id: pr
        if: steps.command.outputs.mode != ''
        run: '"$HELPER" check "${{ steps.command.outputs.mode }}"'

      - name: Free disk space
        if: steps.pr.outputs.ok == 'true'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: The sandbox's tools
        if: steps.pr.outputs.ok == 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap passt
          # Ubuntu 24.04 keeps unprivileged user namespaces, which bubblewrap needs, from programs without an AppArmor profile.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.pr.outputs.ok == 'true'
        with:
          ref: ${{ steps.pr.outputs.head }}
          fetch-depth: 0
          # Claude pushes with the Claude app's token, whose pushes start CI.
          persist-credentials: false
      - name: Builds on the larger disk
        if: steps.pr.outputs.ok == 'true'
        run: |
          if [ -d /mnt ]; then
            sudo mkdir -p /mnt/target && sudo chown "$USER" /mnt/target && ln -s /mnt/target target
          fi
      - name: Rust
        if: steps.pr.outputs.ok == 'true'
        run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.pr.outputs.ok == 'true'
        with:
          workspaces: |
            .
            plugins -> ../target/plugins
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: steps.pr.outputs.ok == 'true'
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.pr.outputs.ok == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        if: steps.pr.outputs.ok == 'true'
        with:
          tool: cargo-nextest,cargo-deny
      - name: Web dependencies and Playwright's browser
        if: steps.pr.outputs.ok == 'true'
        run: |
          pnpm -C web install --frozen-lockfile
          pnpm -C web exec playwright install --with-deps chromium

      # /claude fix
      - name: What to fix
        id: fix_prompt
        if: steps.pr.outputs.ok == 'true' && steps.command.outputs.mode == 'fix'
        run: '"$HELPER" prompt fix'
      - name: Fix
        if: steps.fix_prompt.outcome == 'success'
        uses: anthropics/claude-code-action@4411a9e9b0283becf4b924f7bce360fd7756c78c # v1.0.290
        env:
          BASH_DEFAULT_TIMEOUT_MS: "1800000"
          BASH_MAX_TIMEOUT_MS: "3600000"
          SILT_SKIP_VOICE: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.fix_prompt.outputs.text }}
          claude_args: >-
            --max-turns 250 --permission-mode acceptEdits
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep,TodoWrite"

      # /claude merge: gate, then up to two rounds of fixes, each gated again.
      - name: Gate
        id: gate1
        if: steps.pr.outputs.ok == 'true' && steps.command.outputs.mode == 'merge'
        run: '"$HELPER" gate 1'
      - name: What to fix, first round
        id: prompt1
        if: steps.gate1.outputs.passed == 'false'
        run: '"$HELPER" prompt merge 1 "${{ steps.gate1.outputs.conflicts }}"'
      - name: Fix, first round
        if: steps.prompt1.outcome == 'success'
        uses: anthropics/claude-code-action@4411a9e9b0283becf4b924f7bce360fd7756c78c # v1.0.290
        env:
          BASH_DEFAULT_TIMEOUT_MS: "1800000"
          BASH_MAX_TIMEOUT_MS: "3600000"
          SILT_SKIP_VOICE: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.prompt1.outputs.text }}
          claude_args: >-
            --max-turns 250 --permission-mode acceptEdits
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep,TodoWrite"
      - name: What the first round changed
        id: guard1
        if: steps.prompt1.outcome == 'success'
        env:
          FROM: ${{ steps.gate1.outputs.sha }}
          HEAD_REF: ${{ steps.pr.outputs.head }}
        run: |
          git fetch --quiet origin "$HEAD_REF"
          if [ "$(git rev-parse "origin/$HEAD_REF")" = "$FROM" ]; then
            echo "moved=false" >>"$GITHUB_OUTPUT"
            echo "ok=true" >>"$GITHUB_OUTPUT"
          else
            echo "moved=true" >>"$GITHUB_OUTPUT"
            "$HELPER" guard "$FROM" "origin/$HEAD_REF"
          fi
      - name: Gate, after the first round
        id: gate2
        if: steps.guard1.outputs.ok == 'true' && steps.guard1.outputs.moved == 'true'
        run: '"$HELPER" gate 2'
      - name: What to fix, second round
        id: prompt2
        if: steps.gate2.outputs.passed == 'false'
        run: '"$HELPER" prompt merge 2 "${{ steps.gate2.outputs.conflicts }}"'
      - name: Fix, second round
        if: steps.prompt2.outcome == 'success'
        uses: anthropics/claude-code-action@4411a9e9b0283becf4b924f7bce360fd7756c78c # v1.0.290
        env:
          BASH_DEFAULT_TIMEOUT_MS: "1800000"
          BASH_MAX_TIMEOUT_MS: "3600000"
          SILT_SKIP_VOICE: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.prompt2.outputs.text }}
          claude_args: >-
            --max-turns 250 --permission-mode acceptEdits
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep,TodoWrite"
      - name: What the second round changed
        id: guard2
        if: steps.prompt2.outcome == 'success'
        env:
          FROM: ${{ steps.gate2.outputs.sha }}
          HEAD_REF: ${{ steps.pr.outputs.head }}
        run: |
          git fetch --quiet origin "$HEAD_REF"
          if [ "$(git rev-parse "origin/$HEAD_REF")" = "$FROM" ]; then
            echo "moved=false" >>"$GITHUB_OUTPUT"
            echo "ok=true" >>"$GITHUB_OUTPUT"
          else
            echo "moved=true" >>"$GITHUB_OUTPUT"
            "$HELPER" guard "$FROM" "origin/$HEAD_REF"
          fi
      - name: Gate, after the second round
        id: gate3
        if: steps.guard2.outputs.ok == 'true' && steps.guard2.outputs.moved == 'true'
        run: '"$HELPER" gate 3'

      - name: The head the gate passed on
        id: passed
        if: steps.gate1.outcome == 'success'
        env:
          G1: ${{ steps.gate1.outputs.passed }}
          G2: ${{ steps.gate2.outputs.passed }}
          G3: ${{ steps.gate3.outputs.passed }}
        run: |
          if [ "$G1" = true ]; then
            echo "sha=${{ steps.gate1.outputs.sha }}" >>"$GITHUB_OUTPUT"
            echo "base_sha=${{ steps.gate1.outputs.base_sha }}" >>"$GITHUB_OUTPUT"
          elif [ "$G2" = true ]; then
            echo "sha=${{ steps.gate2.outputs.sha }}" >>"$GITHUB_OUTPUT"
            echo "base_sha=${{ steps.gate2.outputs.base_sha }}" >>"$GITHUB_OUTPUT"
          elif [ "$G3" = true ]; then
            echo "sha=${{ steps.gate3.outputs.sha }}" >>"$GITHUB_OUTPUT"
            echo "base_sha=${{ steps.gate3.outputs.base_sha }}" >>"$GITHUB_OUTPUT"
          else
            echo "sha=" >>"$GITHUB_OUTPUT"
          fi
      - name: CI on that head
        id: ci
        if: steps.passed.outputs.sha != ''
        run: '"$HELPER" ci "${{ steps.passed.outputs.sha }}"'
      - name: Merge
        if: steps.ci.outputs.ci == 'passed'
        run: '"$HELPER" merge "${{ steps.passed.outputs.sha }}" "${{ steps.passed.outputs.base_sha }}"'
      - name: Why it wasn't merged
        if: >-
          always() && steps.command.outputs.mode == 'merge' && steps.pr.outputs.ok == 'true' &&
          steps.ci.outputs.ci != 'passed'
        env:
          CI_RESULT: ${{ steps.ci.outputs.ci }}
          CI_FAILED: ${{ steps.ci.outputs.ci_failed }}
          GUARD1: ${{ steps.guard1.outputs.ok }}
          GUARD2: ${{ steps.guard2.outputs.ok }}
          SHA: ${{ steps.passed.outputs.sha }}
        run: |
          say() { printf '%s\n\n---\n_Run by [this workflow](%s)_\n' "$1" "$RUN_URL" | gh pr comment "$PR" --body-file -; }
          if [ "$GUARD1" = false ] || [ "$GUARD2" = false ]; then
            exit 0 # the guard said why
          elif [ -n "$SHA" ]; then
            case "$CI_RESULT" in
              failed) say "Not merging: the full gate passed on \`${SHA:0:8}\`, but CI failed there: $CI_FAILED." ;;
              none) say "Not merging: the full gate passed on \`${SHA:0:8}\`, but no CI checks started on it within 15 minutes." ;;
              *) say "Not merging: the full gate passed on \`${SHA:0:8}\`, but CI didn't finish there within two hours." ;;
            esac
          else
            say "Not merging: the full gate still fails after two rounds of fixes, or the conflicts couldn't be resolved. Claude's comments above say what it tried; the run's log has the gate's output."
          fi
