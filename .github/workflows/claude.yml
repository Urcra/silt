# Claude on issues and pull requests, from a comment by someone with write
# access, run here with claude-code-action so what Claude writes comes from
# claude[bot]. The notes after a command steer it.
#
# On a pull request:
#   /claude fix [notes]           merge the base in if it conflicts, make the changes
#                                 open reviews and comments ask for, and push
#   /claude merge [notes]         full gate on the head merged with its base, up to
#                                 two rounds of fixes, CI, then a merge commit
#   /claude gate [notes]          the same without the merge
#   /claude review [fix] [notes]  a review, and with `fix` the fixes pushed
# On an issue:
#   /claude fix [notes]           a pull request that fixes it, or questions
#   /claude plan [notes]          a plan as a comment, no code
#   /claude triage [notes]        labels, milestone, duplicates, what's missing
# On either:
#   /claude ask <question>        an answer from the code, no changes
#   /claude cancel                stop this issue's or PR's running Claude jobs
#
# Comments are weighed by their author's association: owner, then members,
# collaborators and contributors; anyone else's only inform. Claude never
# decides to merge: .github/scripts/claude.sh, taken from the default branch
# so a PR can't change it, merges only a head that passed the gate and CI
# with no review left open. Needs the Claude GitHub App on the repository and
# the CLAUDE_CODE_OAUTH_TOKEN secret (`claude setup-token`).
name: Claude
run-name: "Claude on #${{ github.event.issue.number }}"

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Smaller builds, to fit the runner's disk, as scripts/cloud-setup.sh does.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  cancel:
    if: >-
      github.event.comment.user.type != 'Bot' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
      startsWith(github.event.comment.body, '/claude cancel')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      NUMBER: ${{ github.event.issue.number }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Cancel
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID/reactions" -f content=eyes >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/contents/.github/scripts/claude.sh?ref=$DEFAULT_BRANCH" \
            -H 'Accept: application/vnd.github.raw' >"$RUNNER_TEMP/claude.sh"
          bash "$RUNNER_TEMP/claude.sh" cancel

  run:
    if: >-
      github.event.comment.user.type != 'Bot' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
      startsWith(github.event.comment.body, '/claude ') &&
      !startsWith(github.event.comment.body, '/claude cancel')
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    concurrency:
      group: claude-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      checks: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      NUMBER: ${{ github.event.issue.number }}
      KIND: ${{ github.event.issue.pull_request && 'pr' || 'issue' }}
      REQUESTER: ${{ github.event.comment.user.login }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: The command
        id: command
        env:
          BODY: ${{ github.event.comment.body }}
          COMMENT_ID: ${{ github.event.comment.id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # The checks and prompts come from the default branch, not the PR.
          HELPER="$RUNNER_TEMP/claude.sh"
          echo "HELPER=$HELPER" >>"$GITHUB_ENV"
          gh api "repos/$GITHUB_REPOSITORY/contents/.github/scripts/claude.sh?ref=$DEFAULT_BRANCH" \
            -H 'Accept: application/vnd.github.raw' >"$HELPER"
          chmod +x "$HELPER"
          "$HELPER" parse
          if grep -q '^command=$' "$GITHUB_OUTPUT"; then
            gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID/reactions" -f content=confused >/dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID/reactions" -f content=eyes >/dev/null
          fi

      - name: The issue or pull request
        id: target
        if: steps.command.outputs.command != ''
        run: '"$HELPER" check "${{ steps.command.outputs.command }}" "${{ steps.command.outputs.mode }}"'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.target.outputs.ok == 'true'
        with:
          ref: ${{ steps.target.outputs.ref }}
          fetch-depth: 0
          # Claude pushes with the Claude app's token, whose pushes start CI.
          persist-credentials: false

      # The toolchain, for the commands that build, test or push.
      - name: Setting up
        if: steps.target.outputs.ok == 'true' && steps.command.outputs.build == 'true'
        run: '"$HELPER" status set setup active'
      - name: Free disk space
        if: steps.target.outputs.ok == 'true' && steps.command.outputs.build == 'true'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: The sandbox's tools
        if: steps.target.outputs.ok == 'true' && steps.command.outputs.build == 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap passt
          # Ubuntu 24.04 keeps unprivileged user namespaces, which bubblewrap needs, from programs without an AppArmor profile.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Builds on the larger disk
        if: steps.target.outputs.ok == 'true' && steps.command.outputs.build == 'true'
        run: |
          if [ -d /mnt ]; then
            sudo mkdir -p /mnt/target && sudo chown "$USER" /mnt/target && ln -s /mnt/target target
          fi
      - name: Rust
        if: steps.target.outputs.ok == 'true' && steps.command.outputs.build == 'true'
        run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.target.outputs.ok == 'true' && steps.command.outputs.build == 'true'
        with:
          workspaces: |
            .
            plugins -> ../target/plugins
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: steps.target.outputs.ok == 'true' && steps.command.outputs.build == 'true'
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.target.outputs.ok == 'true' && steps.command.outputs.build == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        if: steps.target.outputs.ok == 'true' && steps.command.outputs.build == 'true'
        with:
          tool: cargo-nextest,cargo-deny
      - name: Web dependencies and Playwright's browser
        if: steps.target.outputs.ok == 'true' && steps.command.outputs.build == 'true'
        run: |
          pnpm -C web install --frozen-lockfile
          pnpm -C web exec playwright install --with-deps chromium
          "$HELPER" status set setup 'done'

      # Every command but merge and gate: one go for Claude.
      - name: What to do
        id: prompt
        if: >-
          steps.target.outputs.ok == 'true' &&
          !(env.KIND == 'pr' && (steps.command.outputs.command == 'merge' || steps.command.outputs.command == 'gate'))
        env:
          REVIEW_MODE: ${{ steps.command.outputs.mode }}
        run: '"$HELPER" prompt "${{ steps.command.outputs.command }}"'
      - name: Claude
        id: claude
        if: steps.prompt.outcome == 'success'
        uses: anthropics/claude-code-action@4411a9e9b0283becf4b924f7bce360fd7756c78c # v1.0.290
        env:
          BASH_DEFAULT_TIMEOUT_MS: "1800000"
          BASH_MAX_TIMEOUT_MS: "3600000"
          SILT_SKIP_VOICE: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: >-
            --max-turns ${{ steps.command.outputs.build == 'true' && '250' || '80' }}
            --permission-mode acceptEdits
            --allowedTools "${{ steps.command.outputs.build == 'true' && 'Bash,Read,Edit,Write,Glob,Grep,TodoWrite' || 'Read,Glob,Grep,TodoWrite,Bash(gh api:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh issue comment:*),Bash(gh issue edit:*),Bash(git log:*),Bash(git show:*),Bash(git diff:*),Bash(git fetch:*),Bash(git grep:*)' }}"
            --disallowedTools "Bash(gh pr merge:*),Bash(gh pr close:*),Bash(gh pr review:*),Bash(gh issue close:*),Bash(gh issue delete:*),Bash(gh repo:*),Bash(gh release:*),Bash(gh secret:*),Bash(gh variable:*),Bash(gh workflow:*),Bash(gh run:*),Bash(gh label delete:*)"

      - name: Claude's result
        if: always() && steps.prompt.outcome == 'success'
        run: '"$HELPER" status set claude "${{ steps.claude.outcome == ''success'' && ''done'' || ''failed'' }}"'

      # merge and gate on a pull request: the gate, then up to two rounds of
      # fixes, each gated again.
      - name: Gate
        id: gate1
        if: >-
          steps.target.outputs.ok == 'true' && env.KIND == 'pr' &&
          (steps.command.outputs.command == 'merge' || steps.command.outputs.command == 'gate')
        run: '"$HELPER" gate 1'
      - name: What to fix, first round
        id: prompt1
        if: steps.gate1.outputs.passed == 'false'
        run: '"$HELPER" prompt "${{ steps.command.outputs.command }}" 1 "${{ steps.gate1.outputs.conflicts }}"'
      - name: Fix, first round
        if: steps.prompt1.outcome == 'success'
        uses: anthropics/claude-code-action@4411a9e9b0283becf4b924f7bce360fd7756c78c # v1.0.290
        env:
          BASH_DEFAULT_TIMEOUT_MS: "1800000"
          BASH_MAX_TIMEOUT_MS: "3600000"
          SILT_SKIP_VOICE: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.prompt1.outputs.text }}
          claude_args: >-
            --max-turns 250 --permission-mode acceptEdits
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep,TodoWrite"
            --disallowedTools "Bash(gh pr merge:*),Bash(gh pr close:*),Bash(gh pr review:*),Bash(gh issue close:*),Bash(gh repo:*),Bash(gh release:*),Bash(gh secret:*),Bash(gh variable:*),Bash(gh workflow:*),Bash(gh run:*)"
      - name: What the first round changed
        id: guard1
        if: steps.prompt1.outcome == 'success'
        env:
          FROM: ${{ steps.gate1.outputs.sha }}
          HEAD_REF: ${{ steps.target.outputs.head }}
        run: |
          git fetch --quiet origin "$HEAD_REF"
          if [ "$(git rev-parse "origin/$HEAD_REF")" = "$FROM" ]; then
            echo "moved=false" >>"$GITHUB_OUTPUT"
            echo "ok=true" >>"$GITHUB_OUTPUT"
          else
            echo "moved=true" >>"$GITHUB_OUTPUT"
            "$HELPER" guard "$FROM" "origin/$HEAD_REF"
          fi
      - name: Gate, after the first round
        id: gate2
        if: steps.guard1.outputs.ok == 'true' && steps.guard1.outputs.moved == 'true'
        run: '"$HELPER" gate 2'
      - name: What to fix, second round
        id: prompt2
        if: steps.gate2.outputs.passed == 'false'
        run: '"$HELPER" prompt "${{ steps.command.outputs.command }}" 2 "${{ steps.gate2.outputs.conflicts }}"'
      - name: Fix, second round
        if: steps.prompt2.outcome == 'success'
        uses: anthropics/claude-code-action@4411a9e9b0283becf4b924f7bce360fd7756c78c # v1.0.290
        env:
          BASH_DEFAULT_TIMEOUT_MS: "1800000"
          BASH_MAX_TIMEOUT_MS: "3600000"
          SILT_SKIP_VOICE: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.prompt2.outputs.text }}
          claude_args: >-
            --max-turns 250 --permission-mode acceptEdits
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep,TodoWrite"
            --disallowedTools "Bash(gh pr merge:*),Bash(gh pr close:*),Bash(gh pr review:*),Bash(gh issue close:*),Bash(gh repo:*),Bash(gh release:*),Bash(gh secret:*),Bash(gh variable:*),Bash(gh workflow:*),Bash(gh run:*)"
      - name: What the second round changed
        id: guard2
        if: steps.prompt2.outcome == 'success'
        env:
          FROM: ${{ steps.gate2.outputs.sha }}
          HEAD_REF: ${{ steps.target.outputs.head }}
        run: |
          git fetch --quiet origin "$HEAD_REF"
          if [ "$(git rev-parse "origin/$HEAD_REF")" = "$FROM" ]; then
            echo "moved=false" >>"$GITHUB_OUTPUT"
            echo "ok=true" >>"$GITHUB_OUTPUT"
          else
            echo "moved=true" >>"$GITHUB_OUTPUT"
            "$HELPER" guard "$FROM" "origin/$HEAD_REF"
          fi
      - name: Gate, after the second round
        id: gate3
        if: steps.guard2.outputs.ok == 'true' && steps.guard2.outputs.moved == 'true'
        run: '"$HELPER" gate 3'

      - name: The head the gate passed on
        id: passed
        if: steps.gate1.outcome == 'success'
        env:
          G1: ${{ steps.gate1.outputs.passed }}
          G2: ${{ steps.gate2.outputs.passed }}
          G3: ${{ steps.gate3.outputs.passed }}
          S1: ${{ steps.gate1.outputs.sha }}
          S2: ${{ steps.gate2.outputs.sha }}
          S3: ${{ steps.gate3.outputs.sha }}
          B1: ${{ steps.gate1.outputs.base_sha }}
          B2: ${{ steps.gate2.outputs.base_sha }}
          B3: ${{ steps.gate3.outputs.base_sha }}
        run: |
          if [ "$G1" = true ]; then sha=$S1 base=$B1
          elif [ "$G2" = true ]; then sha=$S2 base=$B2
          elif [ "$G3" = true ]; then sha=$S3 base=$B3
          else sha='' base=''
          fi
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
          echo "base_sha=$base" >>"$GITHUB_OUTPUT"
      - name: The gate's result
        if: steps.command.outputs.command == 'gate' && steps.passed.outcome == 'success'
        env:
          SHA: ${{ steps.passed.outputs.sha }}
          GUARD1: ${{ steps.guard1.outputs.ok }}
          GUARD2: ${{ steps.guard2.outputs.ok }}
        run: |
          say() { "$HELPER" status result "$1"; }
          if [ -n "$SHA" ]; then
            say "✅ Gate passed on \`${SHA:0:8}\`, merged with its base."
          elif [ "$GUARD1" != false ] && [ "$GUARD2" != false ]; then
            say "❌ The full gate still fails after two rounds of fixes, or the conflicts couldn't be resolved. Claude's comments above say what it tried; the run's log has the gate's output."
          fi
      - name: CI on that head
        id: ci
        if: steps.command.outputs.command == 'merge' && steps.passed.outputs.sha != ''
        run: '"$HELPER" ci "${{ steps.passed.outputs.sha }}"'
      - name: Merge
        if: steps.ci.outputs.ci == 'passed'
        run: '"$HELPER" merge "${{ steps.passed.outputs.sha }}" "${{ steps.passed.outputs.base_sha }}"'
      - name: Why it wasn't merged
        if: >-
          !cancelled() && steps.command.outputs.command == 'merge' && steps.target.outputs.ok == 'true' &&
          steps.ci.outputs.ci != 'passed'
        env:
          CI_RESULT: ${{ steps.ci.outputs.ci }}
          CI_FAILED: ${{ steps.ci.outputs.ci_failed }}
          GUARD1: ${{ steps.guard1.outputs.ok }}
          GUARD2: ${{ steps.guard2.outputs.ok }}
          SHA: ${{ steps.passed.outputs.sha }}
        run: |
          say() { "$HELPER" status result "$1"; }
          if [ "$GUARD1" = false ] || [ "$GUARD2" = false ]; then
            exit 0 # the guard said why
          elif [ -n "$SHA" ]; then
            case "$CI_RESULT" in
              failed) say "Not merging: the full gate passed on \`${SHA:0:8}\`, but CI failed there: $CI_FAILED." ;;
              none) say "Not merging: the full gate passed on \`${SHA:0:8}\`, but no CI checks started on it within 15 minutes." ;;
              *) say "Not merging: the full gate passed on \`${SHA:0:8}\`, but CI didn't finish there within two hours." ;;
            esac
          else
            say "Not merging: the full gate still fails after two rounds of fixes, or the conflicts couldn't be resolved. Claude's comments above say what it tried; the run's log has the gate's output."
          fi

      - name: The status comment
        if: always() && steps.command.outputs.command != ''
        run: '"$HELPER" status final "${{ job.status }}"'
