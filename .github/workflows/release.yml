# Builds `silt` from a tag and publishes it, with checksums, on the tag's
# release: static binaries for Linux (ADR 0043), which scripts/install.sh
# installs. Windows isn't built here (ADR 0119).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# A release is the stable channel: it learns of newer releases rather than
# following `main` (ADR 0100).
env:
  SILT_BUILD_CHANNEL: stable

jobs:
  # The web UI is embedded in each binary and is the same for all of them,
  # so it's built once.
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: rustup show

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Web UI
        run: |
          pnpm -C web install --frozen-lockfile
          pnpm -C web build

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/

  build:
    needs: web
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q musl-tools meson ninja-build libcap-dev
          rustup show
          rustup target add ${{ matrix.target }}
          cargo install --locked cargo-about --features cli --version 0.9.3

      - name: silt
        env:
          CC: musl-gcc
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --locked --release -p silt-cli --target ${{ matrix.target }}

      - name: Archive
        run: |
          bin=target/${{ matrix.target }}/release/silt
          strip "$bin"
          file "$bin" | grep -Eq 'static-pie linked|statically linked'
          "$bin" --version
          # Silt's sandbox needs bubblewrap and pasta, shipped beside it (ADR 0093).
          mkdir dist package
          cp "$bin" package/silt
          scripts/build-sandbox-tools.sh package
          # Silt's licence and notices, and those of everything built into it.
          cp LICENSE NOTICE package/
          cp web/dist/THIRD-PARTY-NOTICES.txt package/THIRD-PARTY-NOTICES-web.txt
          cargo about generate --locked --target ${{ matrix.target }} -m crates/silt-cli/Cargo.toml about.hbs -o package/THIRD-PARTY-NOTICES-rust.txt
          tar -czf dist/silt-${{ matrix.target }}.tar.gz -C package .

      - uses: actions/upload-artifact@v4
        with:
          name: silt-${{ matrix.target }}
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: silt-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum silt-* > SHA256SUMS && cat SHA256SUMS
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
