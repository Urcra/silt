<!-- Buttons: secondary by default; n-primary once per view, n-ghost in toolbars, n-danger for destructive actions; n-sm in dense rows, n-lg on empty states. -->
<button type="button" class="n-button n-primary">Merge</button>
<button type="button" class="n-button">Hand off</button>
<button type="button" class="n-button n-ghost"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>New thread</button>
<button type="button" class="n-button n-danger">Stop</button>
<button type="button" class="n-button n-sm">Retry</button>
<button type="button" class="n-button n-primary" disabled>Merge</button>
