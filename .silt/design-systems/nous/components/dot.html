<!-- A 6px status dot where a badge would crowd a row; give it role="img" and aria-label when it stands alone. -->
<span class="n-dot n-ok" role="img" aria-label="Done"></span>
<span class="n-dot n-accent" role="img" aria-label="Working"></span>
<span class="n-dot n-warn" role="img" aria-label="Waiting"></span>
<span class="n-dot n-danger" role="img" aria-label="Failed"></span>
<span class="n-dot" role="img" aria-label="Idle"></span>
