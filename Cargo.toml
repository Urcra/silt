[workspace]
resolver = "3"
members = ["crates/*"]
# Their own workspaces: one needs WebKitGTK (ADR 0041), the other the speech
# engine's native library (ADR 0061).
exclude = ["crates/silt-desktop", "crates/silt-voice"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"
publish = false

# What `silt-bench` measures (ADR 0034): optimized like a release, and
# incremental so the gate rebuilds it quickly.
[profile.perf]
inherits = "release"
incremental = true

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
