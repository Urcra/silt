[package]
name = "silt-acp"
description = "Agent Client Protocol host for running coding agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
agent-client-protocol = { version = "3.4", features = ["process", "unstable_end_turn_token_usage", "unstable_protocol_v2", "unstable_subagents"] }
base64 = "0.23.1"
futures = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
silt-os = { path = "../silt-os" }
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["macros", "rt", "sync", "process", "fs", "time"] }
tokio-util = { version = "0.7.20", features = ["compat"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3.27.0"
