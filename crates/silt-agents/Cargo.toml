[package]
name = "silt-agents"
description = "Agent session adapters: capture, normalize and restore native agent sessions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
aho-corasick = "1.1.5"
memchr = "2.8.3"
portable-pty = "0.9.0"
serde ={ version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
silt-proto = { path = "../silt-proto" }
silt-types = { path = "../silt-types" }
tempfile = "3.27.0"
thiserror = "2.0.21"
uuid = { version = "1.28.0", features = ["v4"] }

[dev-dependencies]
proptest = "1.12.0"
