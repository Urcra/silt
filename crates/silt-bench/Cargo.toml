[package]
name = "silt-bench"
description = "Measures Silt against its performance budgets (ADR 0034)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
exn = "0.3.1"
thiserror = "2.0.21"
reqwest = { version = "0.13.5", features = ["form", "json"] }
serde = "1.0.229"
serde_json = "1.0.154"
silt-agents = { path = "../silt-agents" }
silt-daemon = { path = "../silt-daemon" }
silt-log = { path = "../silt-log" }
silt-os = { path = "../silt-os" }
silt-store = { path = "../silt-store" }
silt-types = { path = "../silt-types" }
tempfile = "3.27.0"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "time"] }
uuid = { version = "1.28.0", features = ["v4"] }
silt-proto = { version = "0.0.1", path = "../silt-proto" }
silt-crdt = { version = "0.0.1", path = "../silt-crdt" }
