[package]
name = "silt-cli"
description = "The silt command-line binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "silt"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
qrcode = { version = "0.14.1", default-features = false }
silt-plugin = { path = "../silt-plugin" }
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
exn = "0.3.1"
thiserror = "2.0.21"
silt-agents = { path = "../silt-agents" }
silt-daemon = { path = "../silt-daemon" }
silt-design = { path = "../silt-design" }
silt-git = { path = "../silt-git" }
sha2 = "0.11.1"
silt-log = { path = "../silt-log" }
silt-llm = { path = "../silt-llm" }
silt-local = { path = "../silt-local" }
silt-mcp = { path = "../silt-mcp" }
silt-os = { path = "../silt-os" }
silt-proto = { path = "../silt-proto" }
silt-redact = { path = "../silt-redact" }
silt-server = { path = "../silt-server" }
silt-sheet = { path = "../silt-sheet" }
silt-theme = { path = "../silt-theme" }
silt-types = { path = "../silt-types" }
silt-update = { path = "../silt-update" }
silt-workspace = { path = "../silt-workspace" }
serde_json = "1.0.154"
uuid = { version = "1.28.0", features = ["v4"] }
tokio = { version = "1.54.0", features = ["net", "rt-multi-thread", "signal", "process", "macros"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
serde = { version = "1.0.229", features = ["derive"] }
rpassword = "7.5.4"
tempfile = "3.27.0"

[dev-dependencies]
axum = "0.8.9"
base64 = "0.23.1"
flate2 = "1.1.11"
futures-util = "0.3.34"
sha2 = "0.11.1"
tar = "0.4.46"
tempfile = "3.27.0"
serde_json = "1.0.154"
silt-redact = { path = "../silt-redact" }
tokio-tungstenite = "0.30.0"
tokio = { version = "1.54.0", features = ["macros", "net", "rt-multi-thread", "time"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", features = ["process"] }
