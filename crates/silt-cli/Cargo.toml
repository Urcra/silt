[package]
name = "silt-cli"
description = "The silt command-line binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "silt"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
exn = "0.3.1"
thiserror = "2.0.21"
silt-agents = { path = "../silt-agents" }
silt-daemon = { path = "../silt-daemon" }
silt-git = { path = "../silt-git" }
silt-harness = { path = "../silt-harness" }
silt-mcp = { path = "../silt-mcp" }
silt-proto = { path = "../silt-proto" }
silt-redact = { path = "../silt-redact" }
silt-sandbox = { path = "../silt-sandbox" }
silt-server = { path = "../silt-server" }
serde_json = "1.0.154"
uuid = { version = "1.28.0", features = ["v4"] }
tokio = { version = "1.54.0", features = ["net", "rt-multi-thread", "signal", "process", "macros"] }
rustix = { version = "1.1.5", features = ["process"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
serde = "1.0.229"
rpassword = "7.5.4"

[dev-dependencies]
tempfile = "3.27.0"
axum = "0.8.9"
serde_json = "1.0.154"
silt-acp = { path = "../silt-acp" }
silt-redact = { path = "../silt-redact" }
tokio = { version = "1.54.0", features = ["macros", "net", "rt-multi-thread", "time"] }
