[package]
name = "silt-cli"
description = "The silt command-line binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "silt"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
exn = "0.3.1"
thiserror = "2.0.21"
silt-agents = { path = "../silt-agents" }
silt-daemon = { path = "../silt-daemon" }
silt-proto = { path = "../silt-proto" }
silt-server = { path = "../silt-server" }
serde_json = "1.0.154"
uuid = { version = "1.28.0", features = ["v4"] }
tokio = { version = "1.54.0", features = ["net", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
serde = "1.0.229"

[dev-dependencies]
tempfile = "3.27.0"
