[package]
name = "silt-crdt"
description = "Eg-walker-style text CRDT with fragment index, anchors and attribution"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
silt-sumtree = { path = "../silt-sumtree" }
silt-types = { path = "../silt-types" }
smallvec = { version = "1.16.3", features = ["serde", "union", "const_generics"] }
thiserror = "2.0.21"

[dev-dependencies]
criterion = "0.8.2"
diamond-types = { git = "https://github.com/josephg/diamond-types", rev = "89ae3a0" }
flate2 = "1.1.10"
postcard = { version = "1.1.3", features = ["alloc"] }
proptest = "1.12.0"
serde = "1.0.229"
serde_json = "1.0.154"

[[bench]]
name = "trace"
harness = false
