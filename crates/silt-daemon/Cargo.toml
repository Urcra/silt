[package]
name = "silt-daemon"
description = "Local Silt daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
axum = "0.8.9"
base64 = "0.23.1"
postcard = { version = "1.1.3", features = ["alloc"] }
futures-util = "0.3.34"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
reqwest = { version = "0.13.5", features = ["json", "query"] }
rust-embed = { version = "8.13.0", features = ["mime-guess"] }
rustix = { version = "1.1.5", features = ["fs", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
silt-acp = { path = "../silt-acp" }
silt-agents = { path = "../silt-agents" }
silt-checkout = { path = "../silt-checkout" }
silt-crdt = { path = "../silt-crdt" }
silt-git = { path = "../silt-git" }
silt-log = { path = "../silt-log" }
silt-mcp = { path = "../silt-mcp" }
silt-proto = { path = "../silt-proto" }
silt-redact = { path = "../silt-redact" }
silt-store = { path = "../silt-store" }
silt-sync = { path = "../silt-sync" }
silt-types = { path = "../silt-types" }
similar = "3.2.0"
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "net", "sync", "time", "macros", "fs", "io-util", "process"] }
tracing = "0.1.44"
uuid = { version = "1.28.0", features = ["v4", "v7"] }

[dev-dependencies]
tempfile = "3.27.0"
