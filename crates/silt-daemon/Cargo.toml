[package]
name = "silt-daemon"
description = "Local Silt daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
silt-web = { path = "../silt-web" }
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
blake3 = "1.8.7"
futures-util = "0.3.34"
postcard = { version = "1.1.3", features = ["alloc"] }
notify = "9.0.0-rc.6"
notify-debouncer-full = "0.8.0-rc.2"
reqwest = { version = "0.13.5", features = ["json", "query", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
silt-acp = { path = "../silt-acp" }
silt-agents = { path = "../silt-agents" }
silt-checkout = { path = "../silt-checkout" }
silt-crdt = { path = "../silt-crdt" }
silt-sheet = { path = "../silt-sheet" }
silt-design = { path = "../silt-design" }
silt-vendor = { path = "../silt-vendor" }
silt-access = { path = "../silt-access" }
silt-plugin = { path = "../silt-plugin" }
silt-plugin-host = { path = "../silt-plugin-host" }
silt-shipped = { path = "../silt-shipped" }
silt-gateway = { path = "../silt-gateway" }
silt-git = { path = "../silt-git" }
silt-llm = { path = "../silt-llm" }
silt-local = { path = "../silt-local" }
silt-log = { path = "../silt-log" }
silt-mcp = { path = "../silt-mcp" }
silt-os = { path = "../silt-os" }
silt-proto = { path = "../silt-proto", features = ["xlsx"] }
silt-theme = { path = "../silt-theme" }
silt-redact = { path = "../silt-redact" }
silt-store = { path = "../silt-store" }
silt-sync = { path = "../silt-sync" }
silt-types = { path = "../silt-types" }
silt-update = { path = "../silt-update" }
silt-workspace = { path = "../silt-workspace" }
similar = "3.2.0"
# Phones on the local network (ADR 0112): the machine's own CA, TLS, mDNS and pushes.
rcgen = { version = "0.14.10", features = ["x509-parser"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
time = "0.3.55"
if-addrs = "0.15.0"
mdns-sd = "0.22.0"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
web-push-native = "0.5.0"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "net", "sync", "time", "macros", "fs", "io-util", "process"] }
tracing = "0.1.44"
uuid = { version = "1.28.0", features = ["v4", "v7"] }
rmcp = { version = "3.10.0", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }

[dev-dependencies]
silt-proto = { path = "../silt-proto", features = ["ts"] }
silt-access = { path = "../silt-access", features = ["ts"] }
silt-plugin = { path = "../silt-plugin", features = ["ts"] }
silt-workspace = { path = "../silt-workspace", features = ["ts"] }
silt-update = { path = "../silt-update", features = ["ts"] }
tempfile = "3.27.0"
ts-rs = { version = "12.0.1", features = ["no-serde-warnings"] }
