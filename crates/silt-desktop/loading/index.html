<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Silt</title>
    <style>
      :root {
        --bg: #f6f7f8;
        --fg: #1f2a37;
        --muted: #5b6673;
        --error: #b42318;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #11161d;
          --fg: #e6eaee;
          --muted: #9aa5b1;
          --error: #f97066;
        }
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.5 system-ui, sans-serif;
      }
      main {
        max-width: 32rem;
        padding: 0 16px;
        text-align: center;
      }
      p {
        color: var(--muted);
      }
      p.error {
        color: var(--error);
      }
      a {
        color: var(--fg);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Silt</h1>
      <p id="status" role="status">Finding the Silt daemon…</p>
      <p id="retry" hidden>Trying again in the background.</p>
      <p id="instead" hidden><a href="silt://open/?backend=native">Show This computer instead</a></p>
    </main>
    <script>
      // The theme Silt last showed, which the app keeps, so this page opens in it.
      const theme = window.__siltTheme
      if (theme) {
        const root = document.documentElement.style
        root.setProperty('color-scheme', theme.appearance)
        root.setProperty('--bg', theme.bg)
        root.setProperty('--fg', theme.fg)
        root.setProperty('--muted', `color-mix(in oklab, ${theme.fg} 70%, ${theme.bg})`)
      }

      // Called by the app while it reaches a machine over SSH.
      function showStatus(message) {
        const status = document.getElementById('status')
        status.textContent = message
        status.className = ''
        document.getElementById('retry').hidden = true
        document.getElementById('instead').hidden = true
      }

      // Called by the app when it can't reach the daemon. Commands come in
      // backticks, which the Silt UI shows as code. `elsewhere` is whether it
      // tried another machine than this one, which can be shown instead.
      function showError(message, elsewhere) {
        const status = document.getElementById('status')
        status.textContent = message.replaceAll('`', '')
        status.className = 'error'
        document.getElementById('retry').hidden = false
        document.getElementById('instead').hidden = !elsewhere
      }
    </script>
  </body>
</html>
