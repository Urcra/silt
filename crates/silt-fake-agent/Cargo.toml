[package]
name = "silt-fake-agent"
description = "A scripted ACP agent for Silt's tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
agent-client-protocol = { version = "5.4", features = ["stdio", "unstable_end_turn_token_usage", "unstable_protocol_v2", "unstable_subagents", "unstable_prompt_suggestions"] }
axum = "0.8.9"
base64 = "0.23.1"
futures-util = "0.3.34"
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde = "1.0.229"
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["macros", "rt-multi-thread", "time", "fs", "process", "net"] }
uuid = { version = "1.28.0", features = ["v4"] }

[dev-dependencies]
silt-acp = { path = "../silt-acp" }
tempfile = "3.27.0"
