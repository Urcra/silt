[package]
name = "silt-gateway"
description = "The gateway a sandboxed agent's traffic leaves through: what it may reach, and the credentials it adds"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
bytes = "1.12.1"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
rcgen = "0.14.10"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
silt-access = { path = "../silt-access" }
silt-os = { path = "../silt-os" }
silt-workspace = { path = "../silt-workspace" }
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["net", "io-util", "rt", "macros", "sync", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1.0.12"

[dev-dependencies]
rcgen = "0.14.10"
tempfile = "3.27.0"
tokio = { version = "1.54.0", features = ["net", "io-util", "rt-multi-thread", "macros", "sync", "time"] }
