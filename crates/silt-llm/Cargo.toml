[package]
name = "silt-llm"
description = "Local models: the catalog, downloads, what fits this machine, and running llama-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
flate2 = "1.1.11"
reqwest = { version = "0.13.5", features = ["json", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
silt-os = { path = "../silt-os" }
tar = "0.4.46"
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["fs", "io-util", "process", "rt", "sync", "time"] }
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
axum = "0.8.9"
tempfile = "3.27.0"
tokio = { version = "1.54.0", features = ["macros", "net", "rt-multi-thread"] }
