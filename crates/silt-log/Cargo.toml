[package]
name = "silt-log"
description = "Delta log model and pure projections for threads and worktrees"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
blake3 = "1.8.7"
postcard = { version = "1.1.3", features = ["alloc"] }
serde = { version = "1.0.229", features = ["derive"] }
silt-crdt = { path = "../silt-crdt" }
silt-types = { path = "../silt-types" }
serde_json = "1.0.154"
similar = "3.2.0"
thiserror = "2.0.21"

[dev-dependencies]
proptest = "1.12.0"
