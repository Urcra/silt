[package]
name = "silt-os"
description = "What each operating system does its own way, behind one interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde_json = "1.0.154"
silt-workspace = { path = "../silt-workspace" }
thiserror = "2.0.21"
# The Keychain on macOS, the Credential Manager on Windows, a Secret Service on Linux.
keyring = "4.2.0"
sysinfo = { version = "0.40.1", default-features = false, features = ["system"] }
tokio = { version = "1.54.0", features = ["process", "net"] }
which = "8.0.6"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", features = ["fs", "process", "pty", "termios"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.5", features = ["fs", "process", "net", "pty", "termios"] }
seccompiler = "0.5.0"

[target.'cfg(windows)'.dependencies]
junction = "2.1.0"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.0", features = ["macros", "rt-multi-thread", "io-util"] }
