[package]
name = "silt-plugin-host"
description = "Runs plugins (ADR 0103): WebAssembly components on wasmtime, with only the capabilities each was granted, within limits, and only the effects a call was approved for"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
blake3 = "1.8.7"
serde = "1.0.229"
serde_json = "1.0.154"
silt-plugin = { path = "../silt-plugin" }
thiserror = "2.0.21"
tracing = "0.1.44"
url = "2.5.7"
wasmtime = { version = "50.0.2", default-features = false, features = ["component-model", "cranelift", "runtime", "std", "parallel-compilation", "cache"] }
wasmtime-wasi = { version = "50.0.2", default-features = false, features = ["p2"] }

[dev-dependencies]
tempfile = "3.27.0"
