[package]
name = "silt-proto"
description = "Sync wire protocol types"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
silt-crdt = { path = "../silt-crdt" }
silt-log = { path = "../silt-log" }
silt-sheet = { path = "../silt-sheet" }
silt-types = { path = "../silt-types" }
silt-workspace = { path = "../silt-workspace" }
ts-rs = { version = "12.0.1", optional = true }
json-patch = "5.0.0"
rust_xlsxwriter = { version = "0.102.0", default-features = false, optional = true }
base64 = "0.22.1"

[features]
# TypeScript declarations of the types the web UI reads.
ts = ["dep:ts-rs", "silt-workspace/ts"]
# A sheet as an `.xlsx` workbook, for the shell crates that serve it.
xlsx = ["dep:rust_xlsxwriter"]
rust_xlsxwriter = ["dep:rust_xlsxwriter"]

[dev-dependencies]
calamine = "0.38.0"
