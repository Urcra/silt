[package]
name = "silt-server"
description = "Self-hostable Silt sync server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
axum = "0.8.9"
blake3 = "1.8.7"
postcard = { version = "1.1.3", features = ["alloc"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
silt-agents = { path = "../silt-agents" }
silt-crdt = { path = "../silt-crdt" }
silt-log = { path = "../silt-log" }
silt-proto = { path = "../silt-proto" }
silt-store = { path = "../silt-store" }
silt-sync = { path = "../silt-sync" }
silt-types = { path = "../silt-types" }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "sqlx-toml"] }
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "net", "sync", "time", "macros", "process", "io-util"] }
tracing = "0.1.44"
uuid = { version = "1.28.0", features = ["v4"] }

[dev-dependencies]
reqwest = { version = "0.13.5", features = ["json"] }
tempfile = "3.27.0"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "process", "io-util"] }
