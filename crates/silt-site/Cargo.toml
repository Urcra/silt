[package]
name = "silt-site"
description = "Builds Silt's docs site from the repository's Markdown"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "silt-site"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
exn = "0.3.1"
pulldown-cmark = { version = "0.13.5", default-features = false, features = ["html"] }
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"
