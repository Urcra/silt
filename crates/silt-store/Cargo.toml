[package]
name = "silt-store"
description = "SQLite delta log, outbox, snapshots and blob store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
blake3 = "1.8.7"
postcard = { version = "1.1.3", features = ["alloc"] }
serde_json = "1.0.154"
silt-log = { path = "../silt-log" }
silt-types = { path = "../silt-types" }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "sqlx-toml"] }
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["fs", "sync"] }
zstd = "0.14.0"

[dev-dependencies]
silt-crdt = { path = "../silt-crdt" }
tempfile = "3.27.0"
tokio = { version = "1.54.0", features = ["macros", "rt-multi-thread"] }
