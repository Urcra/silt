[package]
name = "silt-update"
description = "Which build this is, whether a newer one is out, and the update that installs it"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
silt-os = { path = "../silt-os" }
thiserror = "2.0.21"
ts-rs = { version = "12.0.1", optional = true, features = ["no-serde-warnings"] }

[features]
# TypeScript declarations of the types the web UI reads.
ts = ["dep:ts-rs"]

[dev-dependencies]
tempfile = "3.27.0"
