[package]
name = "silt-vendor"
description = "Fetches and keeps the CDN files artifacts load, for a frame that loads them through Silt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
reqwest = { version = "0.13.5" }
sha2 = "0.11.1"
silt-design = { path = "../silt-design" }
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["fs"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.0", features = ["macros", "rt-multi-thread"] }
