[package]
name = "silt-workspace"
description = "Workspaces: which projects belong to one, and the rules for agents started in it"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
