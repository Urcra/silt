# Licences Silt's dependencies may be under: those that go into an
# AGPL-3.0 program. `scripts/gate.sh` runs `cargo deny check licenses` on
# each of the repository's workspaces; a dependency under anything else
# fails it until it's checked and added here. about.toml lists the same.

[graph]
all-features = true

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "bzip2-1.0.6",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9
# Silt's own crates, none published: AGPL-3.0, or MIT for the plugin SDK.
private = { ignore = true }
