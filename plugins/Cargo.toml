# Plugins shipped with Silt, and the probe its host is tested with (ADR 0104).
# Their own workspace: they build for wasm32-wasip2, not for this machine.
[workspace]
resolver = "3"
members = ["folders", "github", "graphql", "local-mcp", "probe", "probe-local", "remote-mcp", "ssh-commands"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Small and quick to load.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
